name: ArcadeBridge
version: ${project.version}
main: nl.chaosarcade.bridge.ArcadeBridge
api-version: '1.21'
description: Moves in-game money to and from the Chaos Arcade website Vault.
depend: [Vault]
softdepend: [Essentials]
commands:
  arcade:
    description: Link your account, deposit to or withdraw from the website Vault.
    usage: /arcade <link|deposit|withdraw|balance|help>
    aliases: [vault]
permissions:
  arcadebridge.use:
    description: Use /arcade link, deposit, withdraw and balance.
    default: true
  arcadebridge.admin:
    description: Use /arcade status and /arcade reload.
    default: op
