# ArcadeBridge: connects this server's economy (EssentialsX through Vault) to the Chaos Arcade website Vault.

# Full address of vault.php on the website.
website-url: "https://citt.nl/vault.php"

# The SAME long random string as MC_SECRET in the website's lib.php. Keep it private:
# anyone who has it can add money to Vault balances.
secret: "CHANGE-ME-to-a-long-random-string"

# The in-game account that holds the casino's money. Deposits are paid INTO this account and
# withdrawals are paid OUT of it, so the economy stays balanced. Leave empty to create and
# destroy money instead (not recommended).
bank-account: ""

# When true, a normal "/pay <bank-account> <amount>" also counts as a deposit to the
# payer's website Vault (it only counts if the bank's balance really went up).
pay-bank-deposits: true

# Smallest deposit allowed (in-game money).
min-deposit: 1000

# How often (seconds) to check the website for withdrawals players asked for.
poll-seconds: 5

# Shown in front of amounts in chat.
currency-symbol: "$"
