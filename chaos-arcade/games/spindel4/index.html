  <style>
    #splash {
      --bg: #F1BE3C; --text: #4A3828; --bar: rgba(74,56,40,.18);
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #splash .glow { fill: url(#sp-glow-light); }
    @media (prefers-color-scheme: dark) {
      #splash { --bg: #19120F; --text: #F1BE3C; --bar: rgba(241,190,60,.18); }
      #splash .glow { fill: url(#sp-glow-dark); }
    }
    #splash.hidden { opacity: 0; visibility: hidden; }
    #splash .stage { width: min(82vw, 52vh, 360px); aspect-ratio: 1; }
    #splash svg { width: 100%; height: 100%; display: block; }
    /* Zelfde lijnen als het echte bord (_WebPainter): #9C8465, 1.6 dik. */
    #splash .spoke, #splash .ring {
      fill: none; stroke: #9C8465; stroke-width: .8; stroke-linecap: round;
      stroke-dasharray: 700; stroke-dashoffset: 700;
      animation: sp-draw 1.2s ease-out forwards;
    }
    #splash .spoke { animation-duration: .8s; }
    #splash .ring { animation-delay: var(--d); }
    #splash .hub { transform-box: view-box; transform-origin: 100.0px 100.0px; transform: scale(0);
      animation: sp-pop .5s cubic-bezier(.3,1.6,.5,1) 1.4s forwards; }
    #splash .badge { font-family: "Bangers", Impact, "Arial Black", sans-serif; fill: #E8434B;
      stroke: #5A1410; stroke-width: .9; paint-order: stroke fill; }
    #splash .spider-img, #splash .thread { transform-box: view-box; transform-origin: 34.00px 0px; }
    #splash .thread { stroke: #6B5B4B; stroke-width: .8; animation: sp-stretch 2s ease-in-out infinite; }
    #splash .spider-img { animation: sp-bob 2s ease-in-out infinite; }
    #splash .mosquito { transform-box: view-box; transform-origin: 171.00px 169.00px;
      animation: sp-buzz 1.6s ease-in-out infinite; }
    #splash h1 { margin: 14px 0 0; font: 400 clamp(40px, 11vw, 56px)/1 "Bangers", Impact, "Arial Black", sans-serif;
      letter-spacing: 1px; color: #E8434B; -webkit-text-stroke: 5px #5A1410; paint-order: stroke fill; }
    #splash .bar { position: relative; width: 150px; height: 4px; margin-top: 18px; border-radius: 4px;
      background: var(--bar); overflow: hidden; }
    #splash .bar::after { content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%;
      border-radius: 4px; background: #E8434B; animation: sp-slide 1.2s ease-in-out infinite; }
    #splash .label { margin-top: 10px; font-size: 14px; color: var(--text); opacity: .8; }
    @keyframes sp-draw { to { stroke-dashoffset: 0; } }
    @keyframes sp-pop { to { transform: scale(1); } }
    @keyframes sp-bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0.80px, 3.00px); } }
    @keyframes sp-stretch { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes sp-buzz { 0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-1.2px, -2.2px) rotate(-3deg); } 75% { transform: translate(1px, -1px) rotate(2deg); } }
    @keyframes sp-slide { 0% { left: -40%; } 100% { left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
    }

  <script>
    (function () {
      var lang = (navigator.language || 'nl').slice(0, 2).toLowerCase();
      var text = { nl: 'Laden…', en: 'Loading…', de: 'Wird geladen…', fr: 'Chargement…',
                   es: 'Cargando…', pt: 'Carregando…' }[lang] || 'Loading…';
      document.getElementById('splash-label').textContent = text;
      function hideSplash() {
        var el = document.getElementById('splash');
        if (!el || el.classList.contains('hidden')) return;
        el.classList.add('hidden');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 600);
      }
      // Flutter (web) stuurt dit event zodra het eerste beeld getekend is.
      window.addEventListener('flutter-first-frame', hideSplash);
    })();
  </script>
