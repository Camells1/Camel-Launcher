plugins {
    id 'fabric-loom' version '1.17.13'
}

version = project.mod_version
group = 'com.camells'
base { archivesName = 'pavle-vanilla' }

repositories {
    // Only used to test compatibility in a dev run; nothing here ships in the jar.
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Optional: only used if Mod Menu is installed.
    modCompileOnly "com.terraformersmc:modmenu:17.0.1"

    // Compatibility testing only (./gradlew runClient -PwithCompat)
    if (project.hasProperty('withCompat')) {
        modLocalRuntime "maven.modrinth:sodium:mc1.21.11-0.8.15-beta.2-fabric"
        modLocalRuntime "maven.modrinth:sodium-extra:mc1.21.11-0.9.6-beta.2+fabric"
        modLocalRuntime "maven.modrinth:gamma-utils:2.5.10"
        modLocalRuntime "maven.modrinth:cloth-config:21.11.153+fabric"
        modLocalRuntime "com.terraformersmc:modmenu:17.0.1"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
